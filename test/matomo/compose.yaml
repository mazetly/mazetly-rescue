# Reference Matomo instance. Its directory is the kit: compose.yaml, .env and
# volumes/ live here, db/ is filled at backup time. Image tags are replaced by
# digests when the kit is produced (see SPEC.md).
#
# Matomo's code comes from the image. Only what a user can change is mounted:
# the local config, third-party plugins and misc/user. The image declares
# /var/www/html as an anonymous volume and copies its code there only once, so
# a new image needs `docker compose up --renew-anon-volumes` to take effect.
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60
    volumes:
      - db-data:/var/lib/mysql

  app:
    image: matomo:5.13.0-apache
    restart: unless-stopped
    env_file: .env
    environment:
      MATOMO_PLUGIN_DIRS: /var/www/html/extra-plugins;extra-plugins
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./volumes/config/config.ini.php:/var/www/html/config/config.ini.php
      - ./volumes/plugins:/var/www/html/extra-plugins
      - ./volumes/misc-user:/var/www/html/misc/user

volumes:
  db-data:
